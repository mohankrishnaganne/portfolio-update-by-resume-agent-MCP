name: Deploy Web App to EBS

on:
  push:
    branches:
      - DevBranchV2.0
    paths:
      - 'web_app/**'

jobs:
  deploy-web-app:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Create ZIP deployment package
        run: |
          cd web_app
          # Zips the contents of web_app, excluding git files and cache, and saves it in the root directory
          zip -r ../deploy.zip . -x "*.git*" "*__pycache__*"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: "portfolio-generator-app"       # UPDATE THIS
          environment_name: "Portfolio-generator-app-env" # UPDATE THIS
          version_label: "v-${{ github.sha }}"           # Automatically uses the commit hash
          region: "us-east-1"                            # UPDATE THIS if different
          deployment_package: deploy.zip